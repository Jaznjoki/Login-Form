<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Webpage</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

   
 <form action="action_page.php"method="post" >
   <h1>Sign Up</h1>

<div>
   <label for="fname">First name </label>
   <input type="text" id="fname"name="fname"placeholder="Bob"required>
</div>

<br>

<div>
   <label for="lname">Last name </label>
   <input type="text" id="lname"name="lname"placeholder="Marley"required>
</div>
<br>

<div>
   <label for="Pass">Password </label>
   <input type="Password" id="pass"name="pass" maxlength="12" required>
</div>
<div>


<br>
   <label for="email">Email address </label>
   <input type="email" id="email" name="email" placeholder="bobmarley@gmail.com">
</div>
<br>
<div>
<label for="phone">Phone number</label>
   <input type="phone" id="phone" name="phone" maxlength="10" placeholder="0712345678" required>
</div>
<br>
<div>
<label for="bdate">Birthday </label>
   <input type="date" id="bdate" name="bdate">

</div>
<br>
   <div>
<label for="quantity">Quantity </label>
   <input type="number" id="quantity" name="quantity" min="0" max="15" value="1">


   </div>
   <br>
   <div>
  <label for="title">Title:</label>


    <label>Mrs.</label>
     <input type="radio"id="Mrs." name="title"value="Mrs.">

<label>Mr.</label>
    <input type="radio" id="Mr."name="title"value="Mr.">

<label>PhD.</label>
    <input type="radio"id="PhD."name="title"value="PhD.">
    
</div>
<br>
<div>
<label for="payment">Payment</label>
<select name="payment" id="payment">
    <option value="Visa">Visa</option>
    <option value="Mpesa">Mpesa</option>
    <option value="Giftcard">Giftcard</option>

</select>

</div>

<br>
<div>

<button type="submit" class="btn">Reset</button>
 
</div>
<br>
<button type="submit" class="btn">Sign up</button>

 </form>
</body>
</html>
